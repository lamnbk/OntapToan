<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Toán THCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>

/* VOICE: thầy cô dặn dò – rõ ràng, ấm, gọn
   IDEA: cuốn vở ô li của học sinh, giáo viên chấm bằng bút đỏ
   PICTURE: trang vở kẻ ô với lề đỏ; ô số bài như ô chấm điểm
   COLOUR and TYPE: giấy trắng ngà, mực xanh bút bi, bút đỏ GV, dạ quang vàng; Be Vietnam Pro
   LAYOUT: thanh trên + cột dạng bên trái + trang vở bên phải; điện thoại xếp dọc */
:root{color-scheme:light dark;
--bg:light-dark(#eef1f6,#0f1424);--paper:light-dark(#fffef9,#171e33);--grid:light-dark(#dbe6f5,#222c47);
--ink:light-dark(#18233f,#e6ebf7);--mut:light-dark(#5b6683,#9aa6c4);--blue:light-dark(#1d3fa6,#8fb0ff);
--blue-soft:light-dark(#dfe7fb,#24315a);--red:light-dark(#cf2a3b,#ff7a86);--red-soft:light-dark(#fbe2e4,#4a2230);
--amber:light-dark(#b86b00,#ffc05c);--amber-soft:light-dark(#fff0cf,#45351a);--hi:light-dark(#ffe58a,#6b5a12);
--line:light-dark(#d5dbe8,#2c3656);--card:light-dark(#ffffff,#1b233b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px max(3vw,14px);background:var(--paper);border-bottom:2px solid var(--line)}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--mut);min-height:44px}
.tab[aria-current=page]{background:var(--blue-soft);color:var(--blue)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.who b{color:var(--ink)}
.btn{border:1.5px solid var(--line);background:var(--card);padding:9px 16px;border-radius:10px;font-weight:600;min-height:44px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{margin:12px max(3vw,14px) 0;padding:10px 14px;border-radius:10px;background:var(--amber-soft);color:var(--ink);font-size:14px}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding:20px max(3vw,14px) 90px;max-width:1360px;margin:0 auto}
.side{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.side h3{font-size:13px;color:var(--mut);font-weight:600;margin:4px 4px 8px}
.dg{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px;font-weight:600;font-size:15px;line-height:1.35;margin-bottom:2px}
.dg:hover{background:var(--blue-soft)}
.dg[aria-current=true]{background:var(--blue-soft);color:var(--blue)}
.dg small{display:block;font-weight:500;color:var(--mut);font-size:13px;margin-top:4px}
.meter{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--blue)}
.paper{background:var(--paper);border-radius:16px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,30,60,.35);padding:clamp(20px,3vw,40px) clamp(18px,3.5vw,48px) clamp(24px,3vw,40px) clamp(30px,5vw,72px);position:relative;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:100% 26px,26px 100%;background-position:0 12px,0 0}
.paper::before{content:"";position:absolute;top:0;bottom:0;left:clamp(16px,3vw,48px);border-left:2px solid var(--red);opacity:.55}
.paper>*{position:relative}
h1{font-size:clamp(26px,3.4vw,40px);line-height:1.1;margin:0 0 14px;text-wrap:balance;font-weight:800;letter-spacing:-.015em}
h2{font-size:22px;margin:28px 0 10px;font-weight:800}
.kick{font-size:14px;color:var(--mut);margin-bottom:6px;font-weight:600}
.th p,.th li{max-width:75ch}
.th ul,.th ol{padding-left:1.3em;margin:6px 0}
.th li{margin:4px 0}
.lbl{font-weight:800}
.fig{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:16px 0;max-width:560px}
.fig svg{width:100%;height:auto;display:block;font:14px "Be Vietnam Pro",sans-serif}
.f-blue{fill:var(--blue)}.f-red{fill:var(--red)}.f-mut{fill:var(--mut);font-size:12.5px}.f-ink{fill:var(--ink);font-weight:700}.f-num{fill:var(--ink);font-weight:800;font-size:17px}
.ln-blue{stroke:var(--blue);stroke-width:2.5;fill:none}.ln-red{stroke:var(--red);stroke-width:2.5;fill:none}.ln-ink{stroke:var(--ink);stroke-width:2;fill:none}.ln-mut{stroke:var(--mut);stroke-width:1.3;fill:none}.ln-dash{stroke:var(--mut);stroke-width:1.3;stroke-dasharray:4 4}
.pt-blue{fill:var(--blue)}.pt-red{fill:var(--red)}.pt-ink{fill:var(--ink)}
.bar-out{fill:none;stroke:var(--blue);stroke-width:2}.bar-a{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.5}.bar-b rect{fill:var(--amber-soft);stroke:var(--amber);stroke-width:1.5}.band-ok{fill:var(--blue-soft)}
details.ex{border:1.5px dashed var(--blue);border-radius:12px;padding:10px 16px;margin:16px 0;background:var(--card)}
details.ex summary{font-weight:700;cursor:pointer;color:var(--blue)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin:12px 0}
.chip{position:relative;height:48px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-weight:700;font-size:16px}
.chip:hover{border-color:var(--blue)}
.chip.s1{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.s2{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.chip.s3{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.chip.sel{box-shadow:0 0 0 3px var(--hi);border-color:var(--ink)}
.chip.sel::after{content:"✓";position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;line-height:20px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mut)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend .l1::before{background:var(--blue);border-color:var(--blue)}.legend .l2::before{background:var(--amber-soft);border-color:var(--amber)}.legend .l3::before{background:var(--red-soft);border-color:var(--red)}
.pq{font-size:17px}
.pq p{margin:6px 0}
.pq .eq{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.sol{border-left:4px solid var(--blue);background:var(--card);border-radius:0 12px 12px 0;padding:12px 18px;margin:14px 0}
.sol h4{margin:0 0 6px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.assess{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.assess button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:600;min-height:44px}
.assess button[aria-pressed=true].a1{background:var(--blue);color:#fff;border-color:var(--blue)}
.assess button[aria-pressed=true].a2{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.assess button[aria-pressed=true].a3{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.src{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:18px}
.due{font-size:13px;font-weight:600}
.due.late{color:var(--red)}
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 24px)}
.tray .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}
.tray .btn.pri{background:var(--hi);color:#18233f;border-color:var(--hi)}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=date],select,textarea{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);min-height:44px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);padding:6px 12px;border-radius:999px;background:var(--card);min-height:40px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:600}
th.num{text-align:right}table.mx{width:auto}
.chips.wide{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.cell{display:inline-block;width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line);vertical-align:middle}
.cell.s1{background:var(--blue);border-color:var(--blue)}.cell.s2{background:var(--amber-soft);border-color:var(--amber)}.cell.s3{background:var(--red-soft);border-color:var(--red)}
.mx th.pn{padding:8px 3px;text-align:center;min-width:28px}
.mx td.c{padding:6px 3px;text-align:center}
.empty{color:var(--mut);padding:24px 0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.5);display:grid;place-items:center;padding:16px}
.modal .paper{max-width:480px;width:100%}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.pill.red{background:var(--red-soft);color:var(--red)}
.hint{font-size:14px;color:var(--mut)}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.side h3{display:none}.dg{flex:none;width:220px;border:1.5px solid var(--line);background:var(--card)}.who{margin-left:0;width:100%}}
@media(prefers-reduced-motion:no-preference){.chip,.dg,.tab{transition:background .15s,border-color .15s}}

.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.tc{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px;min-height:132px;display:flex;flex-direction:column;gap:6px}
.tc:hover{border-color:var(--blue)}
.tc .no{font-size:13px;font-weight:700;color:var(--red)}
.tc b{font-size:17px;line-height:1.3}
.tc small{color:var(--mut);margin-top:auto}
.chip.lock{background:repeating-linear-gradient(45deg,var(--card),var(--card) 6px,var(--line) 6px,var(--line) 7px);color:var(--mut)}
.chip.lock::before{content:"🔒";font-size:10px;position:absolute;top:2px;right:4px}
.lockbox{border:2px dashed var(--amber);background:var(--amber-soft);border-radius:14px;padding:18px;margin:16px 0}
.pq img{display:block;max-width:min(100%,520px);max-height:380px;width:auto;height:auto;margin:10px auto;background:#fff;border-radius:8px;padding:4px}
.pq p img{display:inline-block;vertical-align:middle;max-height:220px;margin:6px}
.pq table.dt{width:auto;border:1.5px solid var(--line);margin:10px 0;background:var(--card)}
.pq table.dt td{border:1px solid var(--line);white-space:normal;vertical-align:top;font-size:15px}
.plan{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
.plan.full{background:var(--blue);color:#fff}
.back{border:0;background:none;color:var(--blue);font-weight:600;padding:6px 4px;margin-bottom:8px;min-height:40px}
.num-in{width:90px!important}
@media(max-width:860px){.side .back{flex:none;white-space:nowrap;align-self:center}}

.center{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:20px}
.center .paper{max-width:560px;width:100%}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px;min-height:48px}
.gbtn svg{flex:none}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 10px}
.seg button{border:0;background:var(--card);padding:9px 16px;font-weight:600;min-height:42px}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:48px;font-size:16px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default;opacity:1}
.opt.ok{border-color:#1f8a4c;background:light-dark(#e3f5ea,#163a28)}.opt.ok b{background:#1f8a4c;color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-soft)}.opt.bad b{background:var(--red);color:#fff}
.opt.pick{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.verdict{font-weight:800;margin:6px 0}
.verdict.ok{color:#1f8a4c}.verdict.bad{color:var(--red)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue);margin-left:6px}
.tag.tn{background:var(--amber-soft);color:var(--amber)}
.users td{white-space:normal}
.users select,.users input{min-height:36px;padding:4px 8px;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:.08em;background:var(--hi);color:#18233f;padding:2px 8px;border-radius:6px}
.steps li{margin:6px 0}
pre.cfg{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:13px}

.opt.dsrow{flex-wrap:wrap}.opt.dsrow .seg{margin-left:auto}
.opt.dsrow>span:not(.seg){flex:1 1 200px}

.edf{margin:16px 0}
.edf textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;line-height:1.5;resize:vertical}
.edtool{display:flex;gap:6px;flex-wrap:wrap}
.edpv{border:1.5px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;min-height:40px;background:var(--card)}
.edpv p{margin:4px 0}
.edall textarea{border-style:dashed;text-align:center;cursor:pointer}

/* ===== Giao diện 2: "tấm bảng lớp học" =====
   Cột trái xanh bảng đen, chữ phấn trắng, nhấn vàng phấn; nội dung trên nền sáng, sạch.
   Điểm nhớ: bộ chọn lớp 6·7·8·9 bằng chữ số kiểu sách toán (KaTeX_Main). */
:root{
--board:#16302A;--board-2:#1E3D35;--board-3:#28504A;--chalk:#F2C14E;--chalk-ink:#E9F0EC;--chalk-mut:#9DB8AE;
--bg:light-dark(#F2F4F1,#0D1412);--paper:light-dark(#FFFFFF,#141D1A);--grid:transparent;
--ink:light-dark(#15211D,#E4ECE8);--mut:light-dark(#5D6B66,#93A59E);
--blue:light-dark(#1D6650,#7DD3B5);--blue-soft:light-dark(#E2F0EA,#1A3830);
--red:light-dark(#BE3C35,#FF8B82);--red-soft:light-dark(#FBE7E5,#43211F);
--amber:light-dark(#9A6100,#F2C14E);--amber-soft:light-dark(#FDF1D3,#3D3115);--hi:#F2C14E;
--line:light-dark(#E0E5E2,#25322D);--card:light-dark(#FFFFFF,#17211E);
--shadow:0 1px 2px light-dark(rgba(21,33,29,.06),rgba(0,0,0,.4)),0 8px 24px -12px light-dark(rgba(21,33,29,.18),rgba(0,0,0,.6));
--num:"KaTeX_Main","Cambria Math",Georgia,serif}
body{font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:#F2C14E;color:#16302A}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}

/* khung */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px 16px;background:var(--board);color:var(--chalk-ink);
 background-image:radial-gradient(120% 60% at 0% 0%,rgba(255,255,255,.05),transparent 60%);overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--chalk-mut);letter-spacing:0;margin-top:2px}
.logo{width:36px;height:36px;flex:none}
.glbl{display:block;font-size:12px;color:var(--chalk-mut);padding:0 8px 6px}
.gsw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(0,0,0,.18);padding:6px;border-radius:14px}
.gsw button{position:relative;border:0;border-radius:10px;background:transparent;color:var(--chalk-ink);font:500 26px/1 var(--num);height:50px;display:grid;place-items:center}
.gsw button:hover{background:rgba(255,255,255,.07)}
.gsw button[aria-pressed=true]{background:var(--chalk);color:var(--board);font-weight:700;box-shadow:0 4px 14px -4px rgba(242,193,78,.6)}
.gsw button.nodata{color:rgba(233,240,236,.38)}
.gsw button.nodata[aria-pressed=true]{color:var(--board);background:rgba(242,193,78,.55)}
.gsw button.nodata::after{content:"";position:absolute;bottom:7px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.tabs{display:flex;flex-direction:column;gap:2px;flex:1}
.tab{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--chalk-mut);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14.5px;min-height:44px;text-align:left}
.tab:hover{background:rgba(255,255,255,.06);color:var(--chalk-ink)}
.tab[aria-current=page]{background:var(--board-3);color:#fff}
.tab[aria-current=page] .ic{color:var(--chalk)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;background:var(--chalk);color:var(--board);border-radius:999px;padding:1px 8px}
.who{margin:0;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:var(--chalk-mut)}
.who .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--board-3);color:var(--chalk);font-weight:800}
.who .wn{flex:1;line-height:1.3}.who b{display:block;color:var(--chalk-ink);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:0;background:none;color:var(--chalk-mut);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.main{min-width:0}
.banner{margin:16px clamp(14px,3vw,36px) 0;border-radius:12px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.wrap{grid-template-columns:288px minmax(0,1fr);gap:24px;padding:24px clamp(14px,3vw,36px) 96px;max-width:1340px;margin:0}

/* khách: ẩn cột, trang chào */
body.guest .shell{grid-template-columns:1fr}

.hero{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.hero-l{padding:clamp(28px,6vw,88px);display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:680px}
.brand.big{padding:0;font-size:18px;color:var(--ink)}.brand.big b{color:var(--blue)}
.hero h1{font-size:clamp(32px,4.2vw,54px);line-height:1.08;letter-spacing:-.025em;margin:8px 0 0}

.board{display:grid;grid-template-columns:repeat(2,auto);gap:6px 34px;color:var(--chalk-ink);position:relative}
.gn{font:400 clamp(96px,13vw,190px)/1 var(--num);text-align:center;opacity:.92}

/* điện thoại / máy tính bảng */
@media(max-width:900px){
 .shell{grid-template-columns:1fr}
 .rail{position:sticky;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:10px 12px}

 .wrap{grid-template-columns:minmax(0,1fr);padding:16px 12px 96px;gap:14px}

 .dg{flex:none;width:220px;border:1px solid var(--line);background:var(--card)}
 .hero{grid-template-columns:1fr}.hero-r{order:-1;min-height:220px;padding:24px}.board{grid-template-columns:repeat(4,auto);gap:4px 18px}.gn{font-size:64px}

 .dg[aria-current=true]{border-left-color:transparent;border-bottom:3px solid var(--chalk)}
}
@media(prefers-reduced-motion:reduce){.tc{transition:none}.tc:hover{transform:none}}

<template id="setup"><div class="paper"><h1>Cài đặt lần đầu</h1>
<p>Web cần một dự án <b>Firebase</b> (miễn phí) để đăng nhập bằng Gmail và lưu dữ liệu.</p>
<ol class="steps">
<li>Vào <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a>, tạo dự án mới.</li>
<li><b>Build → Authentication → Get started</b>, bật nhà cung cấp <b>Google</b>.</li>
<li><b>Build → Firestore Database → Create database</b> (chọn vị trí gần, ví dụ asia-southeast1).</li>
<li>Tab <b>Rules</b> của Firestore: dán nội dung file <code>firestore.rules</code>, sửa <code>ADMIN_EMAIL@gmail.com</code> thành Gmail của bạn, bấm Publish.</li>
<li><b>Project settings → Your apps → Web (&lt;/&gt;)</b>, đăng kí app, chép đoạn <code>firebaseConfig</code>.</li>
<li>Mở file <code>index.html</code> bằng Notepad, dán cấu hình vào <code>FIREBASE_CONFIG</code> và Gmail Admin vào <code>ADMIN_EMAILS</code> ở đầu phần script.</li>
<li>Đưa <code>index.html</code> lên mạng (Firebase Hosting, Netlify, GitHub Pages…), rồi thêm tên miền đó vào <b>Authentication → Settings → Authorized domains</b>.</li>
<li>Đăng nhập bằng Gmail Admin, vào <b>Gói & dữ liệu</b>, nạp file <code>du_lieu_toan9.json</code>.</li>
</ol>
<p class="hint">Mở trực tiếp file trên máy (file://) sẽ không đăng nhập Google được. Để thử trên máy, dùng địa chỉ http://localhost.</p></div></template>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script type="module">
// ===================== CẤU HÌNH (sửa phần này) =====================
// 1) Dán cấu hình Firebase của bạn (Project settings → Your apps → Web app → Config)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD_MHZ8ppUHaf7AAYq7G35Gdh-047UzZPQ",
  authDomain: "ontaptoan9-ba41e.firebaseapp.com",
  projectId: "ontaptoan9-ba41e",
  storageBucket: "ontaptoan9-ba41e.firebasestorage.app",
  messagingSenderId: "116759498244",
  appId: "1:116759498244:web:0bfb676ad8098935beef51"
};
// 2) Gmail của Admin (quản trị cao nhất). Phải trùng với danh sách trong firestore.rules
const ADMIN_EMAILS = ["doanvanlamvb@gmail.com"];
// ====================================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unesc = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&amp;/g,'&');
const SHORT = {hpt:'Hệ PT',ptqv:'PT bậc nhất',bdt:'BĐT – BPT',can:'Căn thức',tslg:'Lượng giác',dtron:'Đường tròn',hamso:'y = ax²',ptb2:'PT bậc hai',viet:'Vi-ét',gbt:'Lập PT',xs:'Xác suất',nt:'Nội tiếp',khoi:'Hình khối'};
const ST = {1:'Tự làm được',2:'Làm được nhờ xem lời giải',3:'Chưa làm được'};
const ROLE = {admin:'Admin',teacher:'Giáo viên',student:'Học sinh'};
const TYPEN = {tl:'Tự luận', mc:'Nhiều lựa chọn', ds:'Đúng / Sai', tln:'Trả lời ngắn'};
const TYPES = {tl:'TL', mc:'TN', ds:'ĐS', tln:'TLN'};
const LVN = {NB:'Nhận biết', TH:'Thông hiểu', VD:'Vận dụng', VDC:'Vận dụng cao'};
const isTN = y => y === 'mc' || y === 'ds' || y === 'tln';
const GRADES = [6,7,8,9];
const idxPath = g => +g === 9 ? 'meta/index' : 'meta/index' + g;
const impPath = g => +g === 9 ? 'meta/import' : 'meta/import' + g;
const savedGrade = () => { try { const g = +localStorage.getItem('ot_grade'); return GRADES.includes(g) ? g : 0 } catch(e) { return 0 } };
const isAdminEmail = e => !!e && ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(e.toLowerCase());

const S = {B:null, au:null, me:null, idx:null, idxs:{}, grade: savedGrade() || 9, cfg:{basicN:5}, P:{}, cache:{}, prog:null,
  classes:[], users:[], progAll:{}, asg:[], sel:new Set(), topic:null, dang:null, typ:'tl', pid:null, asgId:null,
  openSol:false, ch:null, bai:null, ttyp:'mc', tnth:{}, pick:{}, flt:'pending', q:'', trackCls:'', trackAsg:null, editAsg:null, subs:[]};

/* ---------------- backend ---------------- */
async function initBackend(){
  if (window.__MOCKB) return window.__MOCKB;
  const v='10.12.2', base=`https://www.gstatic.com/firebasejs/${v}/`;
  const [{initializeApp}, A, F] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  const app = initializeApp(FIREBASE_CONFIG); const auth = A.getAuth(app); const db = F.getFirestore(app);
  const ref = p => F.doc(db, p), col = p => F.collection(db, p);
  // Firestore giới hạn mảng lồng mảng và số chỉ mục: gói phần nội dung (mảng, đối tượng) thành chuỗi JSON 'j',
  // chỉ giữ ở ngoài các trường đơn giản dùng cho luật bảo mật và truy vấn (basic, classId, teacherUid, status...).
  const plain = v => v && typeof v === 'object' && Object.getPrototypeOf(v) === Object.prototype;
  const dec = v => Array.isArray(v) ? v.map(dec) : plain(v) ? (Object.keys(v).length === 1 && Array.isArray(v.__a) ? dec(v.__a) : Object.fromEntries(Object.entries(v).map(([k,x]) => [k, dec(x)]))) : v;
  const keep = v => v === null || typeof v === 'number' || typeof v === 'boolean' || (typeof v === 'string' && v.length < 1400) || (v && typeof v === 'object' && !plain(v) && !Array.isArray(v));
  const pack = d => { const o = {}, r = {}; let n = 0; for (const [k, v] of Object.entries(d)) { if (v === undefined) continue; if (keep(v)) o[k] = v; else { r[k] = v; n++ } } if (n) o.j = JSON.stringify(r); return o };
  const unpack = d => { if (typeof d.j === 'string') { const {j, ...o} = d; try { return {...o, ...JSON.parse(j)} } catch(e) { return o } } return dec(d) };
  const sd = s => s.exists() ? {id:s.id, ...unpack(s.data())} : null;
  const q = (c, wh) => F.query(col(c), ...(wh||[]).map(w => F.where(...w)));
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u && {uid:u.uid, email:u.email, name:u.displayName, verified:u.emailVerified})),
    signIn: async () => { const p = new A.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      try { await A.signInWithPopup(auth, p) } catch(e) { if (/popup/.test(e.code||'')) await A.signInWithRedirect(auth, p); else throw e } },
    signOut: () => A.signOut(auth),
    get: async p => sd(await F.getDoc(ref(p))),
    set: (p, d, merge) => F.setDoc(ref(p), pack(d), merge ? {merge:true} : {}),
    update: (p, d) => F.updateDoc(ref(p), pack(d)),
    del: p => F.deleteDoc(ref(p)),
    list: async (c, wh) => (await F.getDocs(q(c, wh))).docs.map(sd),
    watch: (p, cb, err) => F.onSnapshot(ref(p), s => cb(sd(s)), err || (()=>{})),
    watchQ: (c, wh, cb, err) => F.onSnapshot(q(c, wh), s => cb(s.docs.map(sd)), err || (()=>{})),
    batch: async ops => { const b = F.writeBatch(db); ops.forEach(o => o.del ? b.delete(ref(o.p)) : b.set(ref(o.p), pack(o.d), o.merge ? {merge:true} : {})); await b.commit() },
    ts: d => d ? F.Timestamp.fromDate(d) : null, now: () => F.serverTimestamp(),
    count: async c => (await F.getCountFromServer(col(c))).data().count,
  };
}
const toDate = t => !t ? null : t.toDate ? t.toDate() : t.seconds ? new Date(t.seconds*1000) : new Date(t);
const ymd = t => { const d = toDate(t); return d ? d.toISOString().slice(0,10) : '' };
const errMsg = e => (e && (e.code||e.message)) || 'lỗi';
function note(t, ok){ $('#banner').innerHTML = t ? `<div class="banner" ${ok?'style="background:var(--blue-soft)"':''}>${esc(t)}</div>` : '' }
function flash(t){ note(t, 1); setTimeout(()=>note(''), 3500) }
async function safe(fn, msg){ try { return await fn() } catch(e) { console.error(e); note((msg||'Không thực hiện được')+' ('+errMsg(e)+').'); return false } }

/* ---------------- math & content ---------------- */
const mcache = new Map();
function M(h, disp){ if(!h) return ''; const k=(disp?'D':'')+h; if(mcache.has(k)) return mcache.get(k);
  const out = h.replace(/\\\((.*?)\\\)/gs, (_, t) => { try { return katex.renderToString((disp?'\\displaystyle ':'')+unesc(t), {throwOnError:false, strict:'ignore'}) } catch(e) { return esc(t) } });
  if (mcache.size > 3000) mcache.clear(); mcache.set(k, out); return out }
const paras = arr => (arr||[]).map(p => p.tb ? `<div class="scroll"><table class="dt"><tbody>${p.tb.map(r=>`<tr>${r.map(c=>`<td>${M(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
  : p.f ? `<div>${p.h}</div>` : p.m ? `<div class="eq">${M(p.h, true)}</div>` : `<p>${M(p.h)}</p>`).join('');

/* ---------------- roles, plans ---------------- */
const role = () => S.me && S.me.status === 'active' ? S.me.role : null;
const isStaff = () => role() === 'admin' || role() === 'teacher';
const isFull = (u = S.me) => !!u && (u.role === 'admin' || u.role === 'teacher' || (u.plan === 'full' && (!u.until || toDate(u.until) > new Date())));
const planName = u => isFull(u) ? 'Full' : 'Cơ bản';
const topicById = (id, I = S.idx) => I.topics.find(t => t.id === id);
const dangById = (id, I = S.idx) => { for (const t of I.topics) for (const d of t.dangs) if (d.id === id) return d };
const chById = (id, I = S.idx) => (I.tn||[]).find(c => c.id === id);
const baiById = (id, I = S.idx) => { for (const c of (I.tn||[])) for (const b of c.bais) if (b.id === id) return b };
const idxOfM = m => S.idxs[m.g] || S.idx;
const dangOf = m => { const I = idxOfM(m); return m.k === 'tn' ? baiById(m.bai, I).dangs.find(d => d.id === m.d) : dangById(m.d, I) };
const shortOf = (t, I) => SHORT[t.id] || t.short || ('CĐ ' + (I.topics.indexOf(t)+1));
function label(pid){ const m = S.P[pid]; if (!m) return pid; const I = idxOfM(m), d = dangOf(m); const same = d.items.filter(x => x[1] === m.y); const k = same.findIndex(x=>x[0]===pid)+1;
  const gl = m.g !== S.grade ? `L${m.g} · ` : '';
  if (m.k === 'tn') { const b = baiById(m.bai, I), c = chById(m.t, I); return `${gl}C${I.tn.indexOf(c)+1} · Bài ${b.no} · D${b.dangs.indexOf(d)+1} · ${TYPES[m.y]} ${k}` }
  const t = topicById(m.t, I); return `${gl}${shortOf(t, I)} · D${t.dangs.indexOf(d)+1} · TL ${k}` }
function setGrade(g){ g = +g; if (!GRADES.includes(g)) return; S.grade = g; S.idx = S.idxs[g] || null;
  S.topic = S.dang = S.ch = S.bai = S.pid = null; S.ed = null; try { localStorage.setItem('ot_grade', g) } catch(e) {} render(); scrollTo(0,0) }
const hasData = g => !!(S.idxs[g] && (S.idxs[g].topics||[]).length + (S.idxs[g].tn||[]).length);
const stat = (prog, pid) => prog && prog.done && prog.done[pid] ? prog.done[pid].s : 0;
const myAsgs = () => S.asg.filter(a => role()==='student' ? a.classId === S.me.classId : true);
function canSee(pid){ if (isStaff() || isFull()) return true; const m = S.P[pid]; return !!(m && m.basic) }

function seqOf(){ if (S.asgId){ const a = S.asg.find(x=>x.id===S.asgId); return a ? a.pids : [] }

const probShell = () => `<div class="paper" id="prob"><p class="empty">Đang tải bài…</p></div>`;
async function getProb(pid){
  const key = (S.asgId||'') + '/' + pid; if (S.cache[key]) return S.cache[key];
  let p = null;
  if (S.asgId && !isStaff()) p = await S.B.get(`assignments/${S.asgId}/items/${pid}`);
  else if (canSee(pid)) p = await S.B.get('problems/' + pid);
  if (p) S.cache[key] = p; return p }
async function loadProb(){
  const pid = S.pid, seq = seqOf(), k = seq.indexOf(pid), staff = isStaff();
  const a = S.asgId ? S.asg.find(x=>x.id===S.asgId) : null;
  const m = S.P[pid];
  const back = a ? `<button class="btn sm" data-back-asg>← ${esc(a.title)}</button>`
    : m.k === 'tn' ? `<button class="btn sm" data-back>← Bài ${baiById(m.bai).no}</button>`
    : `<button class="btn sm" data-back>← Dạng ${topicById(m.t).dangs.findIndex(x=>x.id===m.d)+1}</button>`;
  const nav = `<div class="row sp" style="margin-top:18px"><button class="btn" data-nav="-1" ${k<=0?'disabled':''}>← Trước</button><button class="btn pri" data-nav="1" ${k>=seq.length-1?'disabled':''}>Tiếp →</button></div>`;
  const head = src => `<div class="row sp">${back}<span class="src">${a?`Câu ${k+1}/${seq.length} trong bài giao · `:''}${src?'Nguồn: '+esc(src):''}</span></div><h1 style="margin-top:16px">${label(pid)}<span class="tag ${isTN(m.y)?'tn':''}">${TYPEN[m.y]}</span>${m.lv?`<span class="tag">${LVN[m.lv]||m.lv}</span>`:''}</h1>`;
  const box = () => document.getElementById('prob');
  if (!a && !canSee(pid)) { if (box()) box().innerHTML = `${head('')}<div class="lockbox"><b>🔒 Câu này thuộc Gói Full.</b><p>Gói Cơ bản mở ${S.cfg.basicN} câu đầu mỗi loại của từng dạng và các bài được giao. Liên hệ Admin để nâng cấp.</p></div>${nav}`; return }
  let P; try { P = await getProb(pid) } catch(e) { P = null }
  if (S.pid !== pid || !box()) return;
  if (!P) { box().innerHTML = `${head('')}<div class="lockbox">Không mở được câu này (chưa có quyền hoặc đã bị xoá).</div>${nav}`; return }
  const rec = S.prog && S.prog.done && S.prog.done[pid];
  const s = rec ? rec.s : 0, answered = !!(rec && (rec.a != null));
  const locked = !staff && a && a.hide && !s;
  let body = `<div class="pq">${paras(P.st)}</div>`, needSelf = false, solLocked = locked;
  if (P.y === 'mc' && P.opts) {
    const chosen = rec && rec.a, key = P.ans;
    body += `<div class="opts">${P.opts.map(o => { let c = '';
      if (chosen) { if (key) { if (o.k === key) c = 'ok'; else if (o.k === chosen) c = 'bad' } else if (o.k === chosen) c = 'pick' }
      return `<button class="opt ${c}" data-ans="${o.k}" ${chosen?'disabled':''}><b>${o.k}</b><span>${M(o.h)}</span></button>` }).join('')}</div>`;
    if (chosen && key) body += `<p class="verdict ${chosen===key?'ok':'bad'}">${chosen===key?'Chính xác!':'Chưa đúng. Đáp án đúng là '+key+'.'}</p><button class="btn sm" data-redo>Làm lại</button>`;
    if (!chosen) solLocked = true; needSelf = !!chosen && !key;
  } else if (P.y === 'ds' && P.items) {
    const key = P.ans || '', mine = answered ? rec.a : (S.pick[pid] || {});
    body += `<div class="opts">${P.items.map((it,i) => { const v = answered ? mine[i] : mine[it.k]; const kv = key[i];
      const cls = answered && key ? (v === kv ? 'ok' : 'bad') : '';
      return `<div class="opt dsrow ${cls}" style="cursor:default"><b>${it.k}</b><span style="flex:1">${M(it.h)}</span>${
        `<span class="seg" style="margin:0"><button data-dsi="${it.k}" data-dsv="Đ" aria-pressed="${v==='Đ'}" ${answered?'disabled':''}>Đúng</button><button data-dsi="${it.k}" data-dsv="S" aria-pressed="${v==='S'}" ${answered?'disabled':''}>Sai</button></span>`}</div>` }).join('')}</div>`;
    if (!answered) { body += `<button class="btn pri" data-dssubmit ${P.items.every(it=>mine[it.k])?'':'disabled'}>Nộp bài</button>`; solLocked = true }
    if (answered && key) { const n = P.items.filter((it,i)=>rec.a[i]===key[i]).length; body += `<p class="verdict ${n===P.items.length?'ok':'bad'}">Đúng ${n}/${P.items.length} ý.${n<P.items.length?' Đáp án: '+P.items.map((it,i)=>it.k+') '+(key[i]==='Đ'?'Đúng':'Sai')).join('; '):''}</p><button class="btn sm" data-redo>Làm lại</button>` }
    needSelf = answered && !key;
  } else if (P.y === 'tln') {
    if (!answered) { body += `<form id="tlnf" class="row" style="margin:12px 0"><input type="text" id="tlnv" placeholder="Nhập kết quả" style="max-width:260px" autocomplete="off"><button class="btn pri">Nộp</button></form><p class="hint">Số thập phân dùng dấu phẩy, phân số viết dạng a/b.</p>`; solLocked = true }
    else { body += `<p>Bạn trả lời: <b>${esc(rec.a)}</b></p>`;

async function batchChunks(ops, prog){ let cur = [], size = 0, done = 0;

async function importData(file){
  const st = $('#impst'); st.textContent = 'Đang đọc file…';
  let J; try { J = JSON.parse(await file.text()) } catch(e) { st.textContent = 'File không đúng định dạng.'; return }
  if (!J.index || !J.problems) { st.textContent = 'File không phải dữ liệu bài học.'; return }
  const g = +(J.index.grade || $('#impg').value || S.grade);
  if (J.index.grade && +$('#impg').value !== g) { st.textContent = `File này là dữ liệu lớp ${g}, nhưng đang chọn nạp cho lớp ${$('#impg').value}. Chọn đúng lớp rồi chọn lại file.`; return }
  const clash = Object.keys(J.problems).find(pid => S.P[pid] && S.P[pid].g !== g);
  if (clash) { st.textContent = `Mã bài ${clash} đã có ở lớp ${S.P[clash].g}. File này có thể là dữ liệu của lớp khác.`; return }
  J.index.grade = g;
  flagIndex(J.index, S.cfg.basicN);
  const bmap = {}; allDangs(J.index).forEach(d=>d.items.forEach(it=>bmap[it[0]]=!!it[2]));
  const ops = Object.keys(J.problems).sort().map(pid => ({p:'problems/'+pid, d:{...J.problems[pid], basic: bmap[pid]||false}}));
  Object.keys(J.tnth||{}).sort().forEach(bid => ops.push({p:'tnth/'+bid, d:J.tnth[bid]}));
  const ver = J.index.version || 'v';
  let start = 0;
  const mk = await safe(() => S.B.get(impPath(g)));
  if (mk && mk.version === ver && mk.n > 0 && mk.n < ops.length && !$('#impfresh').checked) start = mk.n;
  st.textContent = start ? `Tiếp tục từ bài ${start}/${ops.length}…` : `Đang nạp ${ops.length} bài…`;
  try {
    await batchChunks(ops.slice(start), async n => { const k = start + n; st.textContent = `Đang nạp: ${k}/${ops.length} bài… (đừng đóng trang)`; await S.B.set(impPath(g), {version: ver, n: k}) });
    const keepIds = new Set([...Object.keys(J.problems)]);
    const old = S.idxs[g] ? allDangs(S.idxs[g]).flatMap(d=>d.items.map(it=>it[0])).filter(p=>!keepIds.has(p)) : [];
    if (old.length) { st.textContent = `Đang xoá ${old.length} bài cũ…`; await batchChunks(old.map(p=>({p:'problems/'+p, del:1}))) }
    await S.B.set(idxPath(g), J.index);
    await S.B.set(impPath(g), {version: ver, n: ops.length});
    st.textContent = `Xong: đã nạp đủ ${ops.length} bài cho lớp ${g}.`; flash('Nạp dữ liệu thành công.'); checkCount();
  } catch(e) {
    const c = (e && e.code) || '';
    const cur = await safe(() => S.B.get(impPath(g))); const k = cur && cur.n || start;
    st.textContent = /resource-exhausted/.test(c)
      ? `Đã nạp ${k}/${ops.length} bài thì hết hạn mức ghi miễn phí trong ngày của Firebase. Ngày mai chọn lại file để nạp tiếp phần còn lại.`
      : `Dừng ở ${k}/${ops.length} bài (${c||e.message}). Chọn lại file để nạp tiếp từ chỗ dừng.`;
  } }
async function checkCount(){ const el = $('#cnt'); if (!el || !S.B.count) return; el.textContent = 'Đang đếm…';
  const n = await safe(() => S.B.count('problems')); const want = GRADES.reduce((u,g) => u + (S.idxs[g] ? allDangs(S.idxs[g]).reduce((v,d)=>v+d.items.length,0) : 0), 0);
  if (n !== false) el.innerHTML = `Trên máy chủ có <b>${n}</b> bài${want?` / cần ${want} (tất cả các lớp)`:''}.${want && n < want ? ' Thiếu bài: chọn lại file để nạp tiếp.' : ''}` }
async function applyBasic(n){

/* ---------------- soạn / sửa bài (Admin) ---------------- */
const isAdminR = () => role() === 'admin';
const AIKEY = 'ot9_ai';
const aiCfg = () => { try { return JSON.parse(localStorage.getItem(AIKEY) || '{}') } catch(e) { return {} } };
const aiOn = () => !!aiCfg().key;
const IMGRE = /<img\s+src="([^"]+)"[^>]*>/g;
const mEsc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hDec = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;|&#x27;/g,"'").replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
// HTML của web -> chữ để sửa: công thức thành $...$, ảnh thành [ảnh n]
function h2t(h, E){
  h = String(h||'').replace(IMGRE, (_, src) => { const n = ++E.ni; E.imgs[n] = src; return `[ảnh ${n}]` });
  const parts = []; let last = 0;
  h.replace(/\\\((.*?)\\\)/gs, (m, t, i) => { parts.push(hDec(h.slice(last, i).replace(/<br\s*\/?>/g,' '))); parts.push('$' + hDec(t).trim() + '$'); last = i + m.length });
  parts.push(hDec(h.slice(last).replace(/<br\s*\/?>/g,' '))); return parts.join('') }
function p2t(arr, E){ return (arr||[]).map(p => {
  if (p.tb) return p.tb.map(r => '| ' + r.map(c => h2t(c, E)).join(' | ') + ' |').join('\n');
  const t = h2t(p.h, E);
  if (p.m && /^\$[^$]*\$$/.test(t.trim())) return '$' + t.trim() + '$';
  return t }).join('\n') }
// chữ -> HTML: $..$, $$..$$, \(..\), \[..\] là công thức; **đậm**; [ảnh n] là hình
function t2h(s, E){
  let out = '', last = 0; const re = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$|\\\(([\s\S]+?)\\\)|\\\[([\s\S]+?)\\\]/g; let m;
  const txt = x => x.replace(/&(?![a-z]+;|#\d+;)/gi,'&amp;').replace(/<(?!\/?(b|i|u|sup|sub|br)\b)/gi,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\[ảnh (\d+)\]/g, (k, n) => E.imgs[n] ? `<img src="${E.imgs[n]}" alt="Hình vẽ" loading="lazy">` : k);
  while ((m = re.exec(s))) { out += txt(s.slice(last, m.index)); out += '\\(' + mEsc((m[1]||m[2]||m[3]||m[4]).trim()) + '\\)'; last = re.lastIndex }
  return out + txt(s.slice(last)) }
function t2p(s, E){ const L = String(s||'').replace(/\r/g,'').split('\n'), out = []; let tb = null;
  for (let ln of L) { const x = ln.trim();
    if (/^\|.*\|$/.test(x)) { const row = x.slice(1,-1).split('|').map(c => t2h(c.trim(), E)); if (row.every(c => /^:?-{2,}:?$/.test(c))) continue; (tb = tb || []).push(row); continue }
    if (tb) { out.push({tb}); tb = null }
    if (!x) continue;
    const dm = x.match(/^\$\$([\s\S]+)\$\$$/) || x.match(/^\\\[([\s\S]+)\\\]$/);
    if (dm && !/\$\$/.test(dm[1])) { out.push({m:1, h:'\\(' + mEsc(dm[1].trim()) + '\\)'}); continue }
    if (/^\[ảnh \d+\]$/.test(x)) { out.push({f:1, h:t2h(x, E)}); continue }
    out.push({h:t2h(x, E)}) }
  if (tb) out.push({tb}); return out }
const t1 = (s, E) => t2p(s, E).map(p => p.h || '').join('<br>');
const cleanOpt = h => String(h||'').replace(/<\/?b>/g,'').trim().replace(/^[.:]\s*/,'').replace(/\s*\.$/,'');

function newEd(o){ return {imgs:{}, ni:0, f:{}, ans:'', dsk:['','','',''], lv:'NB', src:'', pm: aiOn() ? 'ocr' : 'img', ...o} }
async function openEditor(pid){
  const m = S.P[pid]; if (!m) return;
  note('Đang mở bài để sửa…', 1);
  const P = await safe(() => S.B.get('problems/' + pid), 'Không mở được bài'); note('');
  if (!P) return;
  const E = newEd({pid, k:m.k, t:m.t, bai:m.bai||null, d:m.d, y:m.y, lv:P.lv || m.lv || 'NB', src:P.src||''});
  E.f.st = p2t(P.st, E); E.f.so = p2t(P.so, E);
  if (m.y === 'mc') { (P.opts||[]).forEach((o,i) => E.f['o'+i] = h2t(cleanOpt(o.h), E)); E.ans = P.ans || '' }
  if (m.y === 'ds') { (P.items||[]).forEach((o,i) => E.f['i'+i] = h2t(o.h, E)); E.dsk = [0,1,2,3].map(i => (P.ans||'')[i] || '') }
  if (m.y === 'tln') E.f.tans = h2t(P.ans || '', E);
  S.ed = E; render(); scrollTo(0,0) }
function addEditor(did, y){
  const d = anyDang(did); let t = null, bai = null, k = 'tl';
  for (const T of (S.idx.topics||[])) if (T.dangs.includes(d)) t = T.id;
  for (const C of (S.idx.tn||[])) for (const B of C.bais) if (B.dangs.includes(d)) { k = 'tn'; t = C.id; bai = B.id }

const edField = (name, label, rows, help) => { const E = S.ed;

let pvT = {};
function edInput(name, v){ S.ed.f[name] = v; clearTimeout(pvT[name]); pvT[name] = setTimeout(() => { const el = document.querySelector(`[data-pv="${name}"]`); if (el && S.ed) el.innerHTML = pvHTML(name) }, 250) }
function insAt(name, str){ const ta = document.querySelector(`[data-ef="${name}"]`); if (!ta) return;
  const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
  const pre = a && ta.value[a-1] !== '\n' && /^\[ảnh|\n/.test(str) ? '\n' : '';
  ta.setRangeText(pre + str, a, b, 'end'); edInput(name, ta.value); ta.focus() }

// ảnh: thu nhỏ để lưu (webp) hoặc để gửi AI (jpeg)
function loadImg(file){ return new Promise((ok, no) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { ok(im); URL.revokeObjectURL(u) }; im.onerror = no; im.src = u }) }
function shrink(im, maxW, type, q){ const k = Math.min(1, maxW / im.naturalWidth); const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth*k); c.height = Math.round(im.naturalHeight*k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im, 0, 0, c.width, c.height); return c.toDataURL(type, q) }
async function edImage(file, name, mode){
  const st = $('#edst'); let im; try { im = await loadImg(file) } catch(e) { note('Không đọc được ảnh.'); return }
  if (mode !== 'ocr') { const E = S.ed, n = ++E.ni; E.imgs[n] = shrink(im, 1000, 'image/webp', 0.82); insAt(name, `[ảnh ${n}]\n`); return }
  const url = shrink(im, 1800, 'image/jpeg', 0.9);
  const box = name === '*' ? $('#edall') : document.querySelector(`[data-pv="${name}"]`);
  const msg = t => { if (st) st.textContent = t; if (box && name === '*') box.placeholder = t };
  msg('Đang nhận dạng ảnh…');
  try {
    if (name === '*') { fillAll(await aiRead(url, true)); msg('Đã điền từ ảnh. Kiểm tra lại rồi bấm Lưu.') }
    else { insAt(name, (await aiRead(url, false)).trim() + '\n'); msg('Đã chuyển ảnh thành chữ.') }
  } catch(e) { console.error(e); msg(''); note('Nhận dạng ảnh không được: ' + (e.message || e)) } }

const OCR_TXT = `Chép lại CHÍNH XÁC nội dung toán học trong ảnh (tiếng Việt), không giải, không thêm lời.
Quy tắc: mỗi đoạn/câu một dòng; mọi công thức, kí hiệu, số trong công thức viết LaTeX đặt trong $...$; công thức đứng riêng một dòng viết $$...$$; chữ đậm viết **...**; bảng viết mỗi hàng một dòng dạng | ô | ô |; chỗ có hình vẽ ghi [HÌNH]. Không dùng khối \`\`\`.`;
const OCR_ALL = y => `Ảnh là một câu/bài toán lớp 9 (tiếng Việt). Trả về DUY NHẤT một đối tượng JSON, không giải thích, theo mẫu:
{"de": "đề bài", ${y==='mc'?'"phuong_an": ["nội dung A","nội dung B","nội dung C","nội dung D"], "dap_an": "A|B|C|D hoặc rỗng", ':y==='ds'?'"y": ["ý a","ý b","ý c","ý d"], "dap_an": "chuỗi 4 kí tự Đ/S, ví dụ ĐSĐĐ, hoặc rỗng", ':y==='tln'?'"dap_an": "kết quả số hoặc rỗng", ':''}"loi_giai": "lời giải nếu có trong ảnh, không có thì rỗng"}
Trong mỗi chuỗi: xuống dòng bằng \\n giữa các đoạn; công thức viết LaTeX trong $...$ (nhớ nhân đôi dấu \\ cho đúng JSON); chữ đậm **...**; chỗ có hình vẽ ghi [HÌNH]. Phương án không kèm chữ "A." đầu dòng. Chép đúng như ảnh, không tự giải.`;
async function aiRead(dataUrl, all){
  const c = aiCfg(); if (!c.key) throw new Error('chưa nhập khoá AI');
  const b64 = dataUrl.split(',')[1], prompt = all ? OCR_ALL(S.ed.y) : OCR_TXT; let txt = '';
  if (c.prov === 'claude') {
    const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model: c.model || 'claude-sonnet-5-5', max_tokens: 4096, messages:[{role:'user', content:[{type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}}, {type:'text', text:prompt}]}]})});
    const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || r.status); txt = (j.content||[]).map(x=>x.text||'').join('');
  } else {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model || 'gemini-flash-latest')}:generateContent`, {method:'POST', headers:{'content-type':'application/json','x-goog-api-key':c.key},
      body: JSON.stringify({contents:[{parts:[{text:prompt}, {inline_data:{mime_type:'image/jpeg', data:b64}}]}], generationConfig:{temperature:0, ...(all?{responseMimeType:'application/json'}:{})}})});
    const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
    txt = ((j.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||'').join('') }
  txt = txt.replace(/^\s*```[a-z]*\s*|\s*```\s*$/g, '');
  if (!all) return txt;
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}'); return JSON.parse(txt.slice(a, b+1)) }
function fillAll(J){ const E = S.ed, s = v => String(v ?? '').trim();
  if (s(J.de)) E.f.st = s(J.de); if (s(J.loi_giai)) E.f.so = s(J.loi_giai);
  if (E.y === 'mc' && Array.isArray(J.phuong_an)) { J.phuong_an.slice(0,4).forEach((v,i) => E.f['o'+i] = s(v).replace(/^\*{0,2}[A-D][.):]\*{0,2}\s*/,'')); if (/^[A-D]$/.test(s(J.dap_an).toUpperCase())) E.ans = s(J.dap_an).toUpperCase() }
  if (E.y === 'ds' && Array.isArray(J.y)) { J.y.slice(0,4).forEach((v,i) => E.f['i'+i] = s(v).replace(/^\*{0,2}[a-d][.)]\*{0,2}\s*/,'')); const k = s(J.dap_an).toUpperCase().replace(/D/g,'Đ'); if (/^[ĐS]{4}$/.test(k)) E.dsk = [...k] }
  if (E.y === 'tln' && s(J.dap_an)) E.f.tans = s(J.dap_an);
  edDraw() }

// lưu: ghi bài + cập nhật mục lục + bài giao đang có câu này
const cloneIdx = () => JSON.parse(JSON.stringify(S.idx));
const gOfEd = () => S.grade;
const findDang = (idx, id) => allDangs(idx).find(d => d.id === id);
function reflag(d, n){ const c = {}, ch = []; for (const it of d.items) { c[it[1]] = c[it[1]] || 0; const v = c[it[1]] < n ? 1 : 0; if (v !== it[2]) ch.push(it[0]); it[2] = v; c[it[1]]++ } return ch }
async function saveEditor(){
  const E = S.ed, st = $('#edst'), y = E.y;
  const doc = {t:E.t, d:E.d, y, src:E.src.trim(), st:t2p(E.f.st, E), so:t2p(E.f.so, E)};
  if (!doc.st.length) { note('Đề bài đang trống.'); return }
  if (E.k === 'tn') { doc.bai = E.bai; doc.lv = E.lv }
  if (y === 'mc') { doc.opts = ['A','B','C','D'].map((k,i) => ({k, h:t1(E.f['o'+i]||'', E)})); if (doc.opts.some(o => !o.h)) { note('Cần nhập đủ 4 phương án.'); return } doc.ans = E.ans || '' }
  if (y === 'ds') { doc.items = ['a','b','c','d'].map((k,i) => ({k, h:t1(E.f['i'+i]||'', E)})); if (doc.items.some(o => !o.h)) { note('Cần nhập đủ 4 ý.'); return } doc.ans = E.dsk.every(v=>v) ? E.dsk.join('') : '' }
  if (y === 'tln') { const v = (E.f.tans||'').trim(); doc.ans = v ? (/\$|\\\(/.test(v) ? t1(v, E) : '\\(' + mEsc(v) + '\\)') : '' }
  const size = new Blob([JSON.stringify(doc)]).size; if (size > 900000) { note(`Bài quá nặng (${Math.round(size/1024)} KB, tối đa khoảng 900 KB). Bớt hoặc thu nhỏ hình.`); return }
  const idx = cloneIdx(), d = findDang(idx, E.d); let pid = E.pid, it;
  if (pid) it = d.items.find(x => x[0] === pid);
  else { pid = E.d + 'n' + Date.now().toString(36); it = E.k === 'tn' ? [pid, y, 0, E.lv] : [pid, y, 0]; d.items.push(it) }
  if (E.k === 'tn') it[3] = E.lv;
  reflag(d, S.cfg.basicN); doc.basic = !!it[2];
  if (st) st.textContent = 'Đang lưu…';
  const ok = await safe(async () => {
    const ops = [{p:'problems/'+pid, d:doc}];
    S.asg.filter(a => (a.pids||[]).includes(pid)).forEach(a => ops.push({p:`assignments/${a.id}/items/${pid}`, d:doc}));
    await batchChunks(ops); await S.B.set(idxPath(gOfEd()), idx); return true }, 'Không lưu được bài');
  if (!ok) { if (st) st.textContent = ''; return }
  Object.keys(S.cache).filter(k => k.endsWith('/'+pid)).forEach(k => delete S.cache[k]); S.cache['/'+pid] = {id:pid, ...doc};
  S.ed = null; S.idx = S.idxs[S.grade] = idx; S.P[pid] = E.k === 'tn' ? {g:S.grade, k:'tn', t:E.t, bai:E.bai, d:E.d, y, basic:doc.basic, lv:E.lv} : {g:S.grade, k:'tl', t:E.t, d:E.d, y, basic:doc.basic};
  flash(E.pid ? 'Đã lưu bài.' : 'Đã thêm bài mới.'); openPid(pid) }
async function deleteProblem(pid){
  const m = S.P[pid]; if (!m) return;
  const idx = JSON.parse(JSON.stringify(S.idxs[m.g])), d = findDang(idx, m.d); d.items = d.items.filter(x => x[0] !== pid);
  const ch = reflag(d, S.cfg.basicN);
  const ops = [{p:'problems/'+pid, del:1}, ...ch.map(p => ({p:'problems/'+p, d:{basic: !!d.items.find(x=>x[0]===p)[2]}, merge:1}))];
  const asg = S.asg.filter(a => (a.pids||[]).includes(pid));
  asg.forEach(a => ops.push({p:`assignments/${a.id}/items/${pid}`, del:1}));
  const ok = await safe(async () => { await batchChunks(ops); for (const a of asg) await S.B.update('assignments/'+a.id, {pids: a.pids.filter(p => p !== pid)}); await S.B.set(idxPath(m.g), idx); return true }, 'Không xoá được bài');
  if (ok) { S.pid = null; flash('Đã xoá bài.' + (asg.length ? ` Đã bỏ khỏi ${asg.length} bài giao.` : '')); render() } }

  if (D.bai) { S.bai = D.bai; S.pid = null; render(); scrollTo(0,0); return }
  if (D.ttyp) { S.ttyp = D.ttyp; render(); return }
  if (D.dsi) { const pk = S.pick[S.pid] = S.pick[S.pid] || {}; pk[D.dsi] = D.dsv; loadProb(); return }
  if ('dssubmit' in D) { const P = S.cache[(S.asgId||'')+'/'+S.pid]; const pk = S.pick[S.pid] || {}; const a = P.items.map(it=>pk[it.k]);
    const rec = {a}; if (P.ans) { rec.s = a.join('') === P.ans ? 1 : 3; rec.sc = a.filter((v,i)=>v===P.ans[i]).length; record(S.pid, rec) } else { S.prog.done = S.prog.done||{}; S.prog.done[S.pid] = {a, s:0} }
    delete S.pick[S.pid]; loadProb(); return }
  if (D.pid) { openPid(D.pid); return }
  if (D.apid) { S.asgId = D.aid; S.pid = D.apid; S.openSol = false; render(); scrollTo(0,0); return }
  if ('back' in D) { S.pid = null; render(); return }
  if ('backAsg' in D) { S.pid = null; S.asgId = null; render(); return }
  if ('sol' in D) { S.openSol = !S.openSol; loadProb(); return }
  if (D.nav) { const seq = seqOf(); const p = seq[seq.indexOf(S.pid) + (+D.nav)]; if (p) { S.pid = p; S.openSol = false; if (S.asgId) loadProb(); else openPid(p); scrollTo(0,0) } return }
  if (D.ans) { const P = S.cache[(S.asgId||'')+'/'+S.pid]; const rec = {a: D.ans}; if (P && P.ans) rec.s = D.ans === P.ans ? 1 : 3; else rec.s = 0; if (rec.s) record(S.pid, rec); else { S.prog.done = S.prog.done||{}; S.prog.done[S.pid] = {a:D.ans, s:0} } loadProb(); return }
  if ('redo' in D) { record(S.pid, null); delete S.pick[S.pid]; S.openSol = false; loadProb(); return }
  if (D.as) { const n = +D.as, cur = S.prog.done && S.prog.done[S.pid]; record(S.pid, cur && cur.s === n ? null : {s:n, ...(cur&&cur.a?{a:cur.a}:{})}); loadProb(); return }
  if (D.selall) { anyDang(D.selall).items.filter(x=>x[1]===D.styp).forEach(x=>S.sel.add(x[0])); render(); return }
  if (D.rand) { const ps = anyDang(D.rand).items.filter(x=>x[1]===D.styp && !S.sel.has(x[0])).map(x=>x[0]); for (let i=0;i<5&&ps.length;i++) S.sel.add(ps.splice(Math.floor(Math.random()*ps.length),1)[0]); render(); return }
  if ('clear' in D) { S.sel.clear(); render(); return }
  if (D.unpick) { S.sel.delete(D.unpick); render(); return }
  if (D.edit) { S.editAsg = D.edit; S.sel = new Set(S.asg.find(x=>x.id===D.edit).pids); render(); scrollTo(0,0); return }
  if ('cancel' in D) { S.editAsg = null; S.sel.clear(); render(); return }
  if (D.del) { if (!t.dataset.sure) { t.dataset.sure = 1; t.textContent = 'Bấm lần nữa để xoá'; setTimeout(()=>{ if (t.isConnected) { delete t.dataset.sure; t.textContent = 'Xoá' } }, 4000); return }
    const a = S.asg.find(x=>x.id===D.del); await safe(async () => { await batchChunks(a.pids.map(p=>({p:`assignments/${a.id}/items/${p}`, del:1}))); await S.B.del('assignments/'+a.id) }, 'Không xoá được'); return }
  if (D.track) { S.trackAsg = D.track; const a = S.asg.find(x=>x.id===D.track); if (a) S.trackCls = a.classId; go('theodoi'); return }
  if (D.approve) { const u = S.users.find(x=>x.id===D.approve); await safe(() => S.B.update('users/'+u.id, {status:'active', role:'student'}), 'Không duyệt được'); return }
  if (D.block) { await safe(() => S.B.update('users/'+D.block, {status:'blocked'}), 'Không khoá được'); return }
  if (D.delcls) { if (!t.dataset.sure) { t.dataset.sure = 1; t.textContent = 'Bấm lần nữa để xoá lớp'; return } await safe(() => S.B.del('classes/'+D.delcls), 'Không xoá được lớp'); return }
  if (D.flt) { S.flt = D.flt; render(); return }
  if ('count' in D) { checkCount(); return }
  if ('usave' in D || 'uapprove' in D) { const tr = t.closest('tr'); const v = rowVals(tr); if ('uapprove' in D) v.status = 'active';
    if (await safe(() => S.B.update('users/'+tr.dataset.uid, v), 'Không lưu được')) flash('Đã lưu.'); return }
  if ('bulkapprove' in D || D.bulkplan) { t.disabled = true; const rows = [...document.querySelectorAll('tr[data-uid]')]; let n = 0;
    for (const tr of rows) { const u = S.users.find(x=>x.id===tr.dataset.uid); const v = 'bulkapprove' in D ? {status:'active', role:u.reqRole} : {plan:D.bulkplan};
      if (await safe(() => S.B.update('users/'+u.id, v), 'Lỗi')) n++ } flash(`Đã cập nhật ${n} tài khoản.`); return }
});
document.addEventListener('change', e => { const t = e.target;
  if (t.dataset.pick) { S.sel.has(t.dataset.pick) ? S.sel.delete(t.dataset.pick) : S.sel.add(t.dataset.pick); renderTray(); return }
  if (t.id === 'tcls') { S.trackCls = t.value; S.trackAsg = null; render() }
  if (t.id === 'tasg') { S.trackAsg = t.value; render() }
  if (t.id === 'imp' && t.files[0]) importData(t.files[0]);
  if (t.id === 'edfile' && t.files[0] && S._edT) edImage(t.files[0], S._edT.name, S._edT.mode);
  if (t.id === 'edlv' && S.ed) S.ed.lv = t.value;
});
document.addEventListener('paste', e => { if (!S.ed || !e.target.closest) return; const ta = e.target.closest('[data-ef],#edall'); if (!ta) return;
  const cd = e.clipboardData; if (!cd) return; const it = [...cd.items].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (ta.id === 'edall') { e.preventDefault(); if (it) edImage(it.getAsFile(), '*', 'ocr'); return }
  if (!it || cd.getData('text/plain').trim()) return;
  e.preventDefault(); edImage(it.getAsFile(), ta.dataset.ef, S.ed.pm === 'ocr' && aiOn() ? 'ocr' : 'img') });
document.addEventListener('input', e => { const x = e.target;
  if (S.ed && x.dataset && x.dataset.ef) { edInput(x.dataset.ef, x.value); return }
  if (S.ed && x.id === 'edsrc') { S.ed.src = x.value; return }
  if (x.id === 'edall') { x.value = ''; return } });
document.addEventListener('input', e => { if (e.target.id === 'uq') { S.q = e.target.value; clearTimeout(S._qt); S._qt = setTimeout(() => { render(); const i = $('#uq'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length) } }, 300) } });
document.addEventListener('submit', async e => { e.preventDefault(); const f = e.target;
  if (f.id === 'regf') {
    const reqRole = f.querySelector('[data-rr][aria-pressed=true]').dataset.rr; const name = $('#rn').value.trim(); if (!name) return;
    let c = null; if (reqRole === 'student' && $('#rc').value.trim()) { c = await safe(() => findClass($('#rc').value), 'Không tìm được lớp'); if (c === false) { note('Mã lớp không đúng. Kiểm tra lại với giáo viên, hoặc để trống.'); return } }
    const body = {email: S.au.email, name, school: $('#rs').value.trim(), reqRole, role: null, status: 'pending', plan: 'basic', until: null, classId: c ? c.id : null, teacherUid: c ? c.teacherUid : null, createdAt: Date.now()};
    if (await safe(() => S.B.set('users/'+S.au.uid, body), 'Không gửi được đăng kí') !== false) { note('') } return }
  if (f.id === 'clsjoin') { const c = await safe(() => findClass($('#rc2').value)); if (!c) { note('Mã lớp không đúng.'); return }
    await safe(() => S.B.update('users/'+S.au.uid, {classId:c.id, teacherUid:c.teacherUid}), 'Không cập nhật được'); flash('Đã gửi yêu cầu vào lớp ' + c.name + '.'); return }
  if (f.id === 'newcls') { const name = $('#cn').value.trim(); if (!name) return; const id = 'c' + Date.now().toString(36);
    if (await safe(() => S.B.set('classes/'+id, {name, grade: +$('#cg').value, code: genCode(), teacherUid: S.au.uid, at: Date.now()}), 'Không tạo được lớp') !== false) flash('Đã tạo lớp ' + name + '.'); return }
  if (f.id === 'asgf') { saveAssign(f); return }
  if (f.id === 'tlnf') { const v = $('#tlnv').value.trim(); if (!v) return; const P = S.cache[(S.asgId||'')+'/'+S.pid];
    const rec = {a: v}; if (P.ans) { rec.s = normAns(v) === normAns(P.ans) ? 1 : 3; record(S.pid, rec) } else { S.prog.done = S.prog.done||{}; S.prog.done[S.pid] = {a:v, s:0} } loadProb(); return }
  if (f.id === 'aif') { const key = $('#aikey').value.trim(); localStorage.setItem(AIKEY, JSON.stringify({prov: $('#aiprov').value, key, model: $('#aimodel').value.trim()})); flash(key ? 'Đã lưu khoá AI trên máy này.' : 'Đã xoá khoá.'); render(); return }
  if (f.id === 'planf') { const n = Math.max(0, Math.min(300, parseInt($('#bn').value,10) || 0)); applyBasic(n); return }
});

/* ---------------- session ---------------- */
function unsub(){ S.subs.forEach(u => { try { u() } catch(e){} }); S.subs = [] }
function rebuildP(){ S.P = {};
  for (const g of GRADES) { const d = S.idxs[g]; if (!d) continue;
    for (const t of (d.topics||[])) for (const dg of t.dangs) for (const it of dg.items) S.P[it[0]] = {g, k:'tl', t:t.id, d:dg.id, y:it[1], basic:!!it[2]};
    for (const c of (d.tn||[])) for (const b of c.bais) for (const dg of b.dangs) for (const it of dg.items) S.P[it[0]] = {g, k:'tn', t:c.id, bai:b.id, d:dg.id, y:it[1], basic:!!it[2], lv:it[3]||null} } }
function startSession(){
  unsub(); const B = S.B, uid = S.au.uid, r = role();
  GRADES.forEach(g => S.subs.push(B.watch(idxPath(g), d => { S.idxs[g] = d; rebuildP(); S.idx = S.idxs[S.grade] || null; render() })));
  S.subs.push(B.watch('meta/config', d => { S.cfg = {basicN:5, ...(d||{})}; render() }));
  if (r === 'student') {
    S.subs.push(B.watch('progress/'+uid, d => { if (!S.prog || !d || (d.upd||0) >= (S.prog.upd||0)) S.prog = d || {done:{}}; render() }));
    if (S.me.classId) { S.subs.push(B.watch('classes/'+S.me.classId, d => { S.myClass = d; if (d && d.grade && !savedGrade()) { S.grade = +d.grade; S.idx = S.idxs[S.grade] || null } render() }));
      S.subs.push(B.watchQ('assignments', [['classId','==',S.me.classId]], l => { S.asg = l; render() })) }
  } else {
    S.prog = {done:{}};
    S.subs.push(B.watchQ('classes', r==='admin' ? [] : [['teacherUid','==',uid]], l => { S.classes = l; render() }));
    S.subs.push(B.watchQ('users', r==='admin' ? [] : [['teacherUid','==',uid]], l => { S.users = l; render() }));
    S.subs.push(B.watchQ('assignments', r==='admin' ? [] : [['teacherUid','==',uid]], l => { S.asg = l; render() }));
    S.subs.push(B.watchQ('progress', r==='admin' ? [] : [['teacherUid','==',uid]], l => { S.progAll = {}; l.forEach(p => S.progAll[p.id] = p); if (curView()==='theodoi') render() }));
  }
}
async function onUser(au){
  unsub(); S.au = au; S.me = null; S.idx = null; S.idxs = {}; S.prog = null; S.asg = []; S.users = []; S.classes = [];
  if (!au) { render(); return }
  $('#app').innerHTML = wrap1('<p class="empty">Đang kiểm tra tài khoản…</p>');
  if (isAdminEmail(au.email)) {
    const cur = await safe(() => S.B.get('users/'+au.uid));
    if (!cur || cur.role !== 'admin' || cur.status !== 'active') await safe(() => S.B.set('users/'+au.uid, {email:au.email, name:au.name||au.email, school:'', reqRole:'teacher', role:'admin', status:'active', plan:'full', until:null, classId:null, teacherUid:null, createdAt:Date.now()}), 'Không tạo được tài khoản Admin');
  }
  let first = true;
  S.subs.push(S.B.watch('users/'+au.uid, async d => {
    const wasActive = S.me && S.me.status === 'active', oldRole = S.me && S.me.role, oldCls = S.me && S.me.classId;
    S.me = d;
    if (d && d.status === 'pending' && d.classId && (!S.myClass || S.myClass.id !== d.classId)) { S.myClass = await safe(() => S.B.get('classes/'+d.classId)) || null }
    if (d && d.status === 'active' && (first || !wasActive || oldRole !== d.role || oldCls !== d.classId)) { first = false; const keep = S.subs.shift(); startSession(); S.subs.unshift(keep) }
    render() }, e => note('Không đọc được tài khoản (' + errMsg(e) + ').')));
}
async function boot(){
  if (!window.__MOCKB && !FIREBASE_CONFIG.apiKey) { $('#app').innerHTML = wrap1(document.getElementById('setup').innerHTML, 900); return }
  try { S.B = await initBackend() } catch(e) { $('#app').innerHTML = wrap1(`<div class="paper"><h1>Không kết nối được Firebase</h1><p>${esc(errMsg(e))}</p></div>`); return }
  S.B.onAuth(onUser);
}
boot();

</script>
